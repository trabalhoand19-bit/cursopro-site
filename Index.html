<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <title>Alerta</title>
</head>
<body>

    <!-- Da linha 12 a 14 código do botão -->
    <div class="container">
        <button type="button" id="meuBotao">Clique aqui</button>
    </div>
    <br><br>

    <!-- Código da imagem -->
    <div class="imgs">
        <div class="imagem1">
            <img id="imagem" src="img/Saturno1.webp" width="300px" height="200px">
        </div>
    </div>

    <!-- Verificador de nota --> 

    <div class="verificador">
        <form>
            <label>Digite a sua nota:</label>
            <input type="number" id="nota">
            <button type="button" onclick="verificarNota()">Verificar</button>
        </form>
        <p id="resultado"></p>
    </div>
 


   <!-- Código script verificador de nota --> 

   <script>
    function verificarNota() {
        var nota =
    document.getElementById("nota").value;

        if (nota >= 7){

    document.getElementById("resultado").innerHTML = "Muito bem, você passou!";}

    else{

    document.getElementById("resultado").innerHTML = "Nada legal, tente novamente!";    
    }
    }
   </script>





    <!-- Código script imagem --> 
    <script>
        const img = document.getElementById("imagem");

            img.onmouseover = function() {
                img.src = "img/Saturno2.webp";
            }

            img.onmouseout = function() {
                img.src = "img/Saturno1.webp";
}
    </script>

    <!-- Código script Botao--> 

    <script>
       document.getElementById("meuBotao").onclick = function() {
       alert("Você clicou no botão");
      }
    </script>

    
    
</body>
</html>
